{% extends "base.html" %}
{% block title %}Login · LearnIQ{% endblock %}
{% block content %}
<div class="auth">
  <h1>Welcome back</h1>
  <p class="muted">Log in to continue your practice.</p>
  <form method="post">
  {{ csrf_field() }}
    <label>Email <input type="email" name="email" placeholder="you@example.com" required autofocus></label>
    <label>Password <input type="password" name="password" placeholder="Your password" required></label>
    <button class="btn">Login</button>
  </form>
  <p class="muted center">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</div>
{% endblock %}
